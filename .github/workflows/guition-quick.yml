name: Guition quick check

on:
  push:
    branches: [test-guition-lamp-styling]
    paths:
      - "components/**"
      - "packages/**"
      - "screen_manager/app/core.py"
      - ".github/workflows/guition-quick.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guition:
    name: Guition 4-inch source and firmware
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install only required dependencies
        run: |
          python -m pip install esphome==2026.9.0 PyYAML Pillow fonttools jinja2
      - name: Fast palette and source tests
        run: |
          python -m unittest discover -s tests -p test_card_paint.py
          python -m unittest discover -s tests -p test_theme.py
      - name: Compile Guition only
        run: bash tools/check.sh --firmware --board guition
        env:
          PYTHON: python
